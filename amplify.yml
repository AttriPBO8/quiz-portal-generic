# Build settings for AWS Amplify Hosting. Amplify reads this file automatically.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        # Amplify only passes environment variables to the running app through this file.
        - env | grep -E '^(DATABASE_URL|SESSION_SECRET|DEFAULT_USER_PASSWORD|RATE_LIMIT_PER_MINUTE|DEFAULT_COUNTRY_CODE|MEDIA_BUCKET|MEDIA_BUCKET_REGION|CERTIFICATE_ORGANIZATION|CERTIFICATE_PLACE|APP_URL|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|FACEBOOK_CLIENT_ID|FACEBOOK_CLIENT_SECRET|NEXT_PUBLIC_[A-Z_]+)=' >> .env.production
        # Apply any new database changes, then build.
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
